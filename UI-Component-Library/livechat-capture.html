<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveChat fictional fixture capture</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e9edf3;
      }
      body {
        padding: 24px;
        font-family: Inter, system-ui, sans-serif;
      }
      #capture-root {
        width: min(1180px, 100%);
        margin: 0 auto;
      }
      .capture {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
        padding: 12px 16px;
        border-radius: 12px;
        background: #111318;
        color: white;
      }
      .capture div {
        display: grid;
        gap: 3px;
      }
      .capture small {
        color: #aeb8c7;
      }
      .capture a {
        color: #a8c6ff;
      }
    </style>
  </head>
  <body>
    <div id="capture-root"></div>
    <script type="module" src="/src/previews/livechat-shared/capture.tsx"></script>
  </body>
</html>
